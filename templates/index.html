
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAVE.IA</title>

    <style>

        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #000;
        }


        /* =========================================
           PANTALLA PRINCIPAL
        ========================================= */

        .inicio {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;
        }


        /* =========================================
           VIDEO DE FONDO
        ========================================= */

        .video-fondo {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            /*
                COVER hace que el video
                siempre cubra toda la pantalla
            */
            object-fit: cover;

            /*
                ZOOM DEL VIDEO

                1.00 = normal
                1.10 = poco zoom
                1.20 = zoom recomendado
                1.35 = bastante zoom
                1.50 = zoom fuerte
            */
            transform: scale(1.20);

            /*
                El zoom se realiza
                exactamente desde el centro
            */
            transform-origin: center center;

            z-index: 0;
        }


        /* =========================================
           CAPA OSCURA SOBRE EL VIDEO
        ========================================= */

        .capa-oscura {

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    90deg,

                    rgba(0, 0, 0, 0.80),

                    rgba(0, 0, 0, 0.32),

                    rgba(0, 0, 0, 0.72)
                );

            z-index: 1;
        }


        /* =========================================
           CONTENIDO
        ========================================= */

        .contenido {

            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            color: white;

            padding: 30px;
        }


        /* =========================================
           TEXTO SUPERIOR
        ========================================= */

        .bienvenida {

            font-size: 18px;

            letter-spacing: 7px;

            text-transform: uppercase;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.82
                );

            margin-bottom: 25px;

            opacity: 0;

            animation:

                aparecerArriba
                1.2s
                ease
                forwards,

                brilloTexto
                3s
                ease-in-out
                1.5s
                infinite;
        }


        /* =========================================
           LOGO NAVE
        ========================================= */

        .logo {

            position: relative;

            font-size:
                clamp(
                    70px,
                    13vw,
                    180px
                );

            font-weight: 900;

            letter-spacing: 10px;

            line-height: 0.9;

            color: transparent;

            background:

                linear-gradient(
                    110deg,

                    #ffffff 0%,

                    #ffffff 30%,

                    #63e6ff 50%,

                    #ffffff 70%,

                    #ffffff 100%
                );

            background-size: 250% 100%;

            -webkit-background-clip: text;

            background-clip: text;

            opacity: 0;

            transform: scale(0.5);

            filter:

                drop-shadow(
                    0 0 10px
                    rgba(
                        80,
                        220,
                        255,
                        0.3
                    )
                )

                drop-shadow(
                    0 0 35px
                    rgba(
                        80,
                        220,
                        255,
                        0.15
                    )
                );

            animation:

                aparecerLogo
                1.6s
                cubic-bezier(
                    .17,
                    .67,
                    .25,
                    1.2
                )
                0.3s
                forwards,

                barridoLuz
                4s
                ease-in-out
                2s
                infinite,

                respirar
                3s
                ease-in-out
                3s
                infinite;
        }


        /* =========================================
           DESTELLO DEL LOGO
        ========================================= */

        .logo::after {

            content: "";

            position: absolute;

            top: 0;

            left: -20%;

            width: 10%;

            height: 100%;

            background:

                linear-gradient(
                    90deg,

                    transparent,

                    rgba(
                        255,
                        255,
                        255,
                        0.95
                    ),

                    transparent
                );

            transform:
                skewX(-20deg);

            filter: blur(5px);

            animation:

                destello
                4s
                ease-in-out
                2s
                infinite;
        }


        /* =========================================
           .IA
        ========================================= */

        .ia {

            display: inline-block;

            font-size: 0.42em;

            letter-spacing: 5px;

            vertical-align: middle;

            margin-left: 10px;

            color: #63e6ff;

            opacity: 0;

            animation:

                aparecerIA
                1s
                ease
                1.3s
                forwards,

                brilloIA
                2s
                ease-in-out
                2.3s
                infinite;
        }


        /* =========================================
           DESCRIPCIÓN
        ========================================= */

        .descripcion {

            margin-top: 38px;

            max-width: 780px;

            font-size:

                clamp(
                    18px,
                    2vw,
                    26px
                );

            line-height: 1.5;

            color:

                rgba(
                    255,
                    255,
                    255,
                    0.90
                );

            opacity: 0;

            animation:

                aparecerArriba
                1.2s
                ease
                1.5s
                forwards;
        }


        /* =========================================
           LÍNEA INFERIOR
        ========================================= */

        .linea {

            position: absolute;

            bottom: 35px;

            width: 120px;

            height: 2px;

            background:

                linear-gradient(
                    90deg,

                    transparent,

                    #63e6ff,

                    transparent
                );

            opacity: 0;

            animation:

                aparecer
                1s
                ease
                2.5s
                forwards,

                lineaPulso
                2s
                ease-in-out
                3s
                infinite;
        }


        /* =========================================
           ANIMACIÓN DEL LOGO
        ========================================= */

        @keyframes aparecerLogo {

            0% {

                opacity: 0;

                transform:
                    scale(0.5)
                    translateY(40px);

                filter:

                    blur(20px)

                    drop-shadow(
                        0 0 0
                        transparent
                    );
            }


            60% {

                opacity: 1;

                transform:
                    scale(1.08)
                    translateY(-5px);

                filter:

                    blur(0)

                    drop-shadow(
                        0 0 30px
                        rgba(
                            80,
                            220,
                            255,
                            .5
                        )
                    );
            }


            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter:

                    drop-shadow(
                        0 0 10px
                        rgba(
                            80,
                            220,
                            255,
                            .3
                        )
                    )

                    drop-shadow(
                        0 0 35px
                        rgba(
                            80,
                            220,
                            255,
                            .15
                        )
                    );
            }
        }


        /* =========================================
           ANIMACIÓN .IA
        ========================================= */

        @keyframes aparecerIA {

            from {

                opacity: 0;

                transform:
                    translateX(30px);

                filter: blur(10px);
            }


            to {

                opacity: 1;

                transform:
                    translateX(0);

                filter: blur(0);
            }
        }


        /* =========================================
           BARRIDO DE LUZ
        ========================================= */

        @keyframes barridoLuz {

            0% {

                background-position:
                    200% 0;
            }


            50% {

                background-position:
                    -50% 0;
            }


            100% {

                background-position:
                    200% 0;
            }
        }


        /* =========================================
           DESTELLO
        ========================================= */

        @keyframes destello {

            0% {

                left: -20%;

                opacity: 0;
            }


            15% {

                opacity: 1;
            }


            35% {

                left: 120%;

                opacity: 0;
            }


            100% {

                left: 120%;

                opacity: 0;
            }
        }


        /* =========================================
           RESPIRACIÓN
        ========================================= */

        @keyframes respirar {

            0%,
            100% {

                transform:
                    scale(1);
            }


            50% {

                transform:
                    scale(1.025);
            }
        }


        /* =========================================
           BRILLO .IA
        ========================================= */

        @keyframes brilloIA {

            0%,
            100% {

                text-shadow:

                    0 0 5px
                    rgba(
                        99,
                        230,
                        255,
                        .3
                    );
            }


            50% {

                text-shadow:

                    0 0 10px
                    rgba(
                        99,
                        230,
                        255,
                        .8
                    ),

                    0 0 30px
                    rgba(
                        99,
                        230,
                        255,
                        .5
                    ),

                    0 0 60px
                    rgba(
                        99,
                        230,
                        255,
                        .3
                    );
            }
        }


        /* =========================================
           BRILLO TEXTO
        ========================================= */

        @keyframes brilloTexto {

            0%,
            100% {

                opacity: .7;
            }


            50% {

                opacity: 1;
            }
        }


        /* =========================================
           APARECER DESDE ABAJO
        ========================================= */

        @keyframes aparecerArriba {

            from {

                opacity: 0;

                transform:
                    translateY(30px);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================
           APARECER
        ========================================= */

        @keyframes aparecer {

            from {

                opacity: 0;
            }


            to {

                opacity: 1;
            }
        }


        /* =========================================
           PULSO DE LA LÍNEA
        ========================================= */

        @keyframes lineaPulso {

            0%,
            100% {

                transform:
                    scaleX(1);

                opacity: .6;
            }


            50% {

                transform:
                    scaleX(1.5);

                opacity: 1;
            }
        }


        /* =========================================
           PANTALLAS PEQUEÑAS
        ========================================= */

        @media (max-width: 600px) {

            .bienvenida {

                font-size: 12px;

                letter-spacing: 4px;
            }


            .logo {

                letter-spacing: 4px;
            }


            .descripcion {

                font-size: 17px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         PANTALLA DE PRESENTACIÓN
    ========================================= -->

    <main class="inicio">


        <!-- =====================================
             VIDEO DE FONDO
        ====================================== -->

        <video
            class="video-fondo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >

            <source
                src="videos/video_1.mp4"
                type="video/mp4"
            >

            Tu navegador no puede reproducir
            este video.

        </video>


        <!-- =====================================
             CAPA OSCURA
        ====================================== -->

        <div class="capa-oscura"></div>


        <!-- =====================================
             CONTENIDO
        ====================================== -->

        <section class="contenido">


            <!-- TEXTO SUPERIOR -->

            <div class="bienvenida">

                Bienvenido al futuro

            </div>


            

            <h1 class="logo">

                <span class="ia">NAVE.IA</span>

            </h1>


            <!-- DESCRIPCIÓN -->

            <p class="descripcion">

                Inteligencia artificial diseñada
                para navegar, comprender y
                transformar tus ideas.

            </p>


            <!-- LÍNEA -->

            <div class="linea"></div>


        </section>


    </main>


    <!-- =========================================
         REDIRECCIÓN AUTOMÁTICA
         10 SEGUNDOS
    ========================================= -->

    <script>

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        window.location.replace(
                            "modulos_A/main.html"
                        );

                    },
                    10000
                );

            }
        );

    </script>


</body>
</html>
