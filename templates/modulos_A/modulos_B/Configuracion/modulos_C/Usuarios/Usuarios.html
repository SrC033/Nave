<!DOCTYPE html>
<html lang="es" style="background:#07101F;height:100%;overflow:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORETEKS · Usuarios y Accesos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="css/main.css">
</head>
<body class="modulo-usuarios">
  <main id="view" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  
  <!-- Modal para Crear/Editar Usuario -->
  <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(3,8,16,.8); z-index:999; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px);">
    <div style="background:var(--card); border:1px solid var(--line2); border-radius:14px; padding:24px; width:100%; max-width:440px; box-shadow:var(--sh);">
      <h3 style="font-family:var(--disp); font-size:18px; font-weight:600; margin-bottom:16px;" id="modal-title">Nuevo Usuario</h3>
      
      <div class="fld" style="margin-bottom:12px;">
        <label>Nombre completo</label>
        <input class="inp" id="f-nombre" placeholder="Ej. Juan Pérez">
      </div>
      <div class="fld" style="margin-bottom:12px;">
        <label>Correo electrónico</label>
        <input class="inp" id="f-correo" type="email" placeholder="juan@empresa.com">
      </div>
      
      <div class="fld" style="margin-bottom:12px;">
        <label>Contraseña</label>
        <div style="position:relative;">
          <input class="inp" id="f-pass" type="password" placeholder="••••••••" style="padding-right:36px;">
          <button type="button" id="toggle-pass" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--dim); cursor:pointer;">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <small id="pass-help" style="display:none; color:var(--dim); font-size:11px; margin-top:4px;">Dejar en blanco para no cambiar la contraseña actual.</small>
      </div>

      <div class="fld" style="margin-bottom:20px;">
        <label>Tipo de Cuenta</label>
        <select class="inp" id="f-rol">
          <option value="estandar">Usuario Normal</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn outline" id="btn-cancel-modal">Cancelar</button>
        <button class="btn p" id="btn-save-modal">Guardar Usuario</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
